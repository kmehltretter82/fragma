# Portable, explicit prover selection. Executables resolve through the checked
# environment assembled by fragma.toolchain, not a user's global Why3 config.
# CVC5 1.3.4 changed its banner; Why3 1.8.2 automatic detection misses it.
# Its existing cvc5 driver is retained as a disclosed compatibility assumption.
[main]
magic = 14
memlimit = 1000
running_provers_max = 2
timelimit = 5.0

[prover]
name = "Alt-Ergo"
version = "2.6.3"
shortcut = "alt-ergo"
command = "alt-ergo --timelimit %.t %f"
command_steps = "alt-ergo --steps-bound=%S %f"
driver = "alt_ergo_26"

[prover]
name = "CVC5"
version = "1.3.4"
shortcut = "cvc5"
command = "cvc5 --stats-internal --tlimit=%T %f"
command_steps = "cvc5 --stats-internal --rlimit=%S %f"
driver = "cvc5"

[prover]
name = "Z3"
version = "4.13.4"
shortcut = "z3"
command = "z3 -smt2 -T:%t sat.random_seed=42 nlsat.randomize=false smt.random_seed=42 -st %f"
command_steps = "z3 -smt2 sat.random_seed=42 nlsat.randomize=false smt.random_seed=42 -st rlimit=%S %f"
driver = "z3_487"
